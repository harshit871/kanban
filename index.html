<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <nav>
        <div class="left">Kanban</div>
        <div class="right">
          <button id="toggle-modal">Add new task</button>
        </div>
      </nav>

      <section class="board">
        <div id="todo" class="task-column">
          <div class="heading">
            <div class="left">Todo</div>
            <div class="right">1</div>
          </div>

          <div class="task" draggable="true">
            <h2>Task 1</h2>
            <p>Description for Task 1</p>
            <button>Delete</button>
          </div>
        </div>

        <div id="progress" class="task-column">
          <div class="heading">
            <div class="left">In Progress</div>
            <div class="right">1</div>
          </div>

          <div class="task" draggable="true">
            <h2>Task 2</h2>
            <p>Description for Task 2</p>
            <button>Delete</button>
          </div>
        </div>

        <div id="done" class="task-column">
          <div class="heading">
            <div class="left">Completed</div>
            <div class="right">1</div>
          </div>

          <div class="task" draggable="true">
            <h2>Task 3</h2>
            <p>Description for Task 3</p>
            <button>Delete</button>
          </div>
        </div>
      </section>
    </main>

    <div class="modal add-new-task">
      <div class="bg"></div>
      <div class="center">
        <input type="text" id="title" name="title" placeholder="Title" />
        <textarea
          name="description"
          id="description"
          placeholder="Description"
        ></textarea>
        <button type="submit" id="add-new-task" class="add-task-btn">
          Add Task
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
